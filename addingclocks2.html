<script>
  const second = document.querySelector(".hand3");
  const minute = document.querySelector(".hand2");
  const hour = document.querySelector(".hand1");

  function tick() {
  	const hours = new Date().getHours(); // 0-12
    const minutes = new Date().getMinutes(); // 0-59
    const seconds = new Date().getSeconds(); // 0–59

    hour.style.transform = `rotate(${hours * 30}deg)`;
    minute.style.transform = `rotate(${minutes * 6}deg)`;
    second.style.transform = `rotate(${seconds * 6}deg)`;
  console.log(new Date().getSeconds())
  }

  tick();
  setInterval(tick, 1000);

const div = document.getElementById("door");
const image = document.getElementById("chico");

div.addEventListener("click", () => {
    image.style.display = "block";

    setTimeout(() => {
        image.style.display = "none";
    }, 3000);
});
